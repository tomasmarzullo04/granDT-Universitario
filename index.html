<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-buho.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Título y SEO -->
    <title>Gran DT UNI - Edición 2026</title>
    <meta name="description" content="El Fantasy Rugby oficial del Club Universitario de Mar del Plata." />
    
    <!-- OpenGraph (WhatsApp, Facebook, etc.) -->
    <meta property="og:title" content="Gran DT UNI" />
    <meta property="og:description" content="El Fantasy Rugby oficial del Club Universitario de Mar del Plata." />
    <meta property="og:image" content="/logo-buho.png" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <!-- Diagnostic Script -->
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.backgroundColor = 'red';
        div.style.color = 'white';
        div.style.padding = '10px';
        div.style.zIndex = '999999';
        div.style.fontSize = '12px';
        div.style.wordBreak = 'break-all';
        div.innerHTML = '<strong>Error Detectado:</strong> ' + msg + '<br>Línea: ' + lineNo + '<br>' + (error ? error.stack : '');
        document.body.appendChild(div);
        return false;
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
